<li class="task-item" [class.completed]="task.completed" [class.editing]="isEditing">
  <ng-container *ngIf="!isEditing; else editTemplate">
    <div class="task-row">
      <label class="checkbox-container" [attr.aria-label]="'Completar ' + task.title">
        <input
          type="checkbox"
          [checked]="task.completed"
          [disabled]="busy"
          (change)="onToggle()"
        />
        <span class="custom-checkbox" aria-hidden="true">
          <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8 L7 11 L12 5" />
          </svg>
        </span>
      </label>

      <div class="task-details" (dblclick)="startEdit($event)">
        <span class="task-title">{{ task.title }}</span>
        <span class="task-date" [class.overdue]="isOverdue">
          {{ dueAt | date: 'dd/MM/yyyy, HH:mm' }}
          <span class="overdue-tag" *ngIf="isOverdue">Vencida</span>
        </span>
      </div>

      <div class="task-actions">
        <button
          type="button"
          class="action-btn"
          [class.active]="expanded"
          (click)="toggleExpanded()"
          [attr.aria-expanded]="expanded"
          [title]="expanded ? 'Ocultar subtareas' : 'Ver subtareas'"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
          </svg>
          <span class="badge" *ngIf="task.subtaskTotal > 0">{{ task.subtaskTotal }}</span>
        </button>

        <button type="button" class="action-btn" (click)="startEdit($event)" title="Editar tarea">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z" />
          </svg>
        </button>

        <button
          type="button"
          class="action-btn delete-btn"
          (click)="onDelete($event)"
          [disabled]="busy"
          title="Eliminar tarea"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
          </svg>
        </button>
      </div>
    </div>

    <!-- NRF-10: la barra solo aparece cuando la tarea tiene subtareas. -->
    <app-progress-bar
      *ngIf="task.subtaskTotal > 0"
      [progress]="task.progress"
      [completed]="task.subtaskCompleted"
      [total]="task.subtaskTotal"
    ></app-progress-bar>

    <p class="task-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <app-subtask-list
      *ngIf="expanded"
      [taskId]="task.id"
      [subtasks]="task.subtasks"
    ></app-subtask-list>
  </ng-container>

  <ng-template #editTemplate>
    <div class="edit-mode">
      <input
        #editInput
        type="text"
        class="edit-input"
        [(ngModel)]="editTitle"
        (keyup.enter)="saveEdit()"
        (keyup.escape)="cancelEdit()"
        placeholder="Nombre de la tarea"
      />

      <div class="edit-datetime">
        <input type="date" class="edit-input" [(ngModel)]="editDate" />
        <input type="time" class="edit-input" [(ngModel)]="editTime" />
      </div>

      <p class="task-error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="edit-actions">
        <button type="button" class="btn-save" (click)="saveEdit()" [disabled]="busy">
          {{ busy ? 'Guardando…' : 'Guardar' }}
        </button>
        <button type="button" class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
      </div>
    </div>
  </ng-template>
</li>
