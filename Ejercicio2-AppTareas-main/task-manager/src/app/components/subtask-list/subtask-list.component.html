<div class="subtasks">
  <ul class="subtask-list" *ngIf="subtasks.length > 0">
    <li
      class="subtask"
      *ngFor="let subtask of subtasks; trackBy: trackById"
      [class.completed]="subtask.completed"
    >
      <label class="subtask-check">
        <input
          type="checkbox"
          [checked]="subtask.completed"
          [disabled]="busyId === subtask.id"
          (change)="onToggle(subtask)"
        />
        <span class="custom-checkbox" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8 L7 11 L12 5" />
          </svg>
        </span>
        <span class="subtask-title">{{ subtask.title }}</span>
      </label>

      <button
        type="button"
        class="subtask-delete"
        (click)="onDelete(subtask)"
        [disabled]="busyId === subtask.id"
        [attr.aria-label]="'Eliminar subtarea ' + subtask.title"
        title="Eliminar subtarea"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 L6 18 M6 6 L18 18" />
        </svg>
      </button>
    </li>
  </ul>

  <div class="add-subtask">
    <input
      type="text"
      class="subtask-input"
      [class.input-error]="errorMessage"
      [(ngModel)]="newTitle"
      (keyup.enter)="onAdd()"
      placeholder="Agregar subtarea…"
      autocomplete="off"
      [disabled]="adding"
    />
    <button type="button" class="subtask-add-btn" (click)="onAdd()" [disabled]="adding">
      {{ adding ? 'Agregando…' : 'Agregar' }}
    </button>
  </div>

  <p class="subtask-error" *ngIf="errorMessage">
    <span class="error-icon" aria-hidden="true">!</span>
    <span>{{ errorMessage }}</span>
  </p>
</div>
