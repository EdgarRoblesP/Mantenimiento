<app-auth-card
  title="Recupera tu contraseña"
  subtitle="Escribe tu correo y te enviaremos un enlace para restablecerla."
>
  <app-banner
    *ngIf="sent"
    [message]="'Listo. Si existe una cuenta con ' + sentTo + ', enviamos un enlace de recuperación. Caduca en 30 minutos.'"
    kind="success"
  ></app-banner>

  <app-banner *ngIf="errorMessage" [message]="errorMessage" kind="danger"></app-banner>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-form-field
      label="Correo electrónico"
      controlId="email"
      [error]="emailError"
      [success]="sent ? 'Enlace enviado.' : null"
    >
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="tu@correo.com"
        autocomplete="email"
      />
    </app-form-field>

    <button
      type="submit"
      class="btn"
      [class.btn-primary]="!sent"
      [class.btn-outline]="sent"
      [disabled]="submitting"
    >
      <span class="spinner" *ngIf="submitting" aria-hidden="true"></span>
      {{ submitting ? 'Enviando…' : (sent ? 'Reenviar enlace' : 'Enviar enlace de recuperación') }}
    </button>
  </form>

  <p class="form-footer">
    <a routerLink="/iniciar-sesion">Volver a iniciar sesión</a>
  </p>
</app-auth-card>
