<app-auth-card [title]="title" [subtitle]="subtitle">
  <div class="state-icon" [ngClass]="'state-' + state" aria-hidden="true">
    <span class="spinner spinner-lg" *ngIf="state === 'verifying'"></span>

    <svg
      *ngIf="state === 'verified'"
      width="28" height="28" viewBox="0 0 20 20" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    >
      <path d="M4 10.5 L8.5 15 L16 6" />
    </svg>

    <svg
      *ngIf="state === 'pending'"
      width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
    >
      <rect x="2" y="4" width="20" height="16" rx="2" />
      <path d="M2 7 L12 13 L22 7" />
    </svg>

    <span class="state-bang" *ngIf="state === 'failed'">!</span>
  </div>

  <app-banner
    *ngIf="state === 'failed'"
    [message]="errorMessage"
    kind="danger"
  ></app-banner>

  <app-banner
    *ngIf="resendMessage"
    [message]="resendMessage"
    kind="success"
  ></app-banner>

  <div class="actions">
    <button
      type="button"
      class="btn btn-primary"
      *ngIf="state === 'verified'"
      (click)="goToLogin()"
    >
      Iniciar sesión
    </button>

    <button
      type="button"
      class="btn btn-outline"
      *ngIf="(state === 'pending' || state === 'failed') && email"
      (click)="onResend()"
      [disabled]="resending"
    >
      <span class="spinner" *ngIf="resending" aria-hidden="true"></span>
      {{ resending ? 'Enviando…' : 'Reenviar correo de verificación' }}
    </button>
  </div>

  <p class="form-footer">
    <a routerLink="/iniciar-sesion">Volver a iniciar sesión</a>
  </p>
</app-auth-card>
