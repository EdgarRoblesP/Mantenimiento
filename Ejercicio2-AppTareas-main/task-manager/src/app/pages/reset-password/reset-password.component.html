<app-auth-card
  title="Crea una nueva contraseña"
  subtitle="Elige una contraseña segura para tu cuenta."
>
  <app-banner *ngIf="errorMessage" [message]="errorMessage" kind="danger"></app-banner>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate *ngIf="token">
    <app-form-field
      label="Nueva contraseña"
      controlId="password"
      [error]="errorFor('password')"
    >
      <app-password-input
        controlId="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      ></app-password-input>
    </app-form-field>

    <ul class="rules">
      <li class="rule" *ngFor="let rule of rules" [class.rule-ok]="rule.test(passwordValue)">
        <span class="rule-icon" aria-hidden="true">
          <svg
            *ngIf="rule.test(passwordValue)"
            width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          >
            <path d="M4 8 L7 11 L12 5" />
          </svg>
        </span>
        <span>{{ rule.label }}</span>
      </li>
    </ul>

    <app-form-field
      label="Confirmar nueva contraseña"
      controlId="confirmPassword"
      [error]="errorFor('confirmPassword')"
    >
      <app-password-input
        controlId="confirmPassword"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="Repite tu contraseña"
      ></app-password-input>
    </app-form-field>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting">
      <span class="spinner" *ngIf="submitting" aria-hidden="true"></span>
      {{ submitting ? 'Guardando…' : 'Guardar contraseña' }}
    </button>
  </form>

  <p class="form-footer">
    <a routerLink="/recuperar-contrasena" *ngIf="!token">Solicitar un enlace nuevo</a>
    <a routerLink="/iniciar-sesion" *ngIf="token">Volver a iniciar sesión</a>
  </p>
</app-auth-card>
