<app-auth-card
  title="Crea tu cuenta"
  subtitle="Solo necesitas tu correo electrónico y una contraseña."
>
  <app-banner
    *ngIf="banner"
    [message]="banner.message"
    [kind]="banner.kind"
    [actionLabel]="banner.action"
    (action)="goToLogin()"
  ></app-banner>

  <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-form-field label="Correo electrónico" controlId="email" [error]="errorFor('email')">
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="tu@correo.com"
        autocomplete="email"
      />
    </app-form-field>

    <app-form-field label="Contraseña" controlId="password" [error]="errorFor('password')">
      <app-password-input
        controlId="password"
        formControlName="password"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      ></app-password-input>
    </app-form-field>

    <ul class="rules" *ngIf="showRules">
      <li class="rule" *ngFor="let rule of rules" [class.rule-ok]="rule.test(passwordValue)">
        <span class="rule-icon" aria-hidden="true">
          <svg
            *ngIf="rule.test(passwordValue)"
            width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          >
            <path d="M4 8 L7 11 L12 5" />
          </svg>
        </span>
        <span>{{ rule.label }}</span>
      </li>
    </ul>

    <app-form-field
      label="Confirmar contraseña"
      controlId="confirmPassword"
      [error]="errorFor('confirmPassword')"
    >
      <app-password-input
        controlId="confirmPassword"
        formControlName="confirmPassword"
        autocomplete="new-password"
        placeholder="Repite tu contraseña"
      ></app-password-input>
    </app-form-field>

    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting">
      <span class="spinner" *ngIf="submitting" aria-hidden="true"></span>
      {{ submitting ? 'Creando cuenta…' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="form-footer">
    ¿Ya tienes cuenta?
    <a routerLink="/iniciar-sesion">Inicia sesión</a>
  </p>
</app-auth-card>
