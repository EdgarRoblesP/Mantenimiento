<div class="field" [class.field-error]="error" [class.field-success]="success && !error">
  <label class="field-label" [attr.for]="controlId">{{ label }}</label>

  <ng-content></ng-content>

  <p class="field-hint" *ngIf="hint && !error && !success">{{ hint }}</p>

  <p class="field-message message-danger" *ngIf="error">
    <span class="message-icon" aria-hidden="true">!</span>
    <span>{{ error }}</span>
  </p>

  <p class="field-message message-success" *ngIf="success && !error">
    <span class="message-icon" aria-hidden="true">
      <svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8 L7 11 L12 5" />
      </svg>
    </span>
    <span>{{ success }}</span>
  </p>
</div>
